name: Validate HTML archive

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HTML document
        run: test -s index.html

      - name: Confirm page title exists
        run: grep -q '<title>Bootcamp 2020 HTML Practice | Umer Sajid</title>' index.html
